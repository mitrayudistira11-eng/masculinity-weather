
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather GPS Auto</title>

<style>
/* ================= BODY ================= */

body{
margin:0;
font-family:sans-serif;
min-height:100vh;

display:flex;
justify-content:center;
align-items:flex-start;

padding:40px 0;

color:white;
overflow-y:auto;

/* 🔥 FIX: jangan none */
background:#050b18;

background-size:400% 400%;
animation:bgMove 20s ease infinite;
}

/* gradient move */
@keyframes bgMove{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

/* ================= TIME BACKGROUND ================= */

body.morning{
background:linear-gradient(-45deg,#FFB75E,#ED8F03,#FFD194,#FF9966);
}
body.day{
background:linear-gradient(-45deg,#56CCF2,#2F80ED,#4facfe,#00c6ff);
}
body.evening{
background:linear-gradient(-45deg,#ff9966,#ff5e62,#f7971e,#ffd200);
}
body.night{
background:linear-gradient(-45deg,#020617,#050b18,#070f1f,#000000);
}

/* ================= SKY ================= */

#sky{
position:fixed;
inset:0;
z-index:0;
pointer-events:none;
overflow:hidden;
}

/* SUN / MOON */

.sunMoon{
position:absolute;
width:120px;
height:120px;
border-radius:50%;
top:15%;
left:50%;
transform:translateX(-50%);
transition:1s;
}

.sun{
background:radial-gradient(circle,#fff799,#ffb347,#ff8800);
box-shadow:0 0 80px rgba(255,180,0,.9);
}

.moon{
background:radial-gradient(circle,#fff,#ccc,#999);
box-shadow:0 0 30px rgba(255,255,255,.6);
}

/* CLOUDS */

.clouds{
position:absolute;
inset:0;
background:
radial-gradient(circle at 20% 40%,rgba(255,255,255,.6) 60px,transparent 70px),
radial-gradient(circle at 60% 30%,rgba(255,255,255,.6) 70px,transparent 80px);
animation:cloudMove 80 ease-in-out infinite;
opacity:.3;
filter:blur(8px);
}

.cloud{
position:absolute;
background:
radial-gradient(circle at 30% 50%, rgba(255,255,255,.95) 60%, transparent 70%),
radial-gradient(circle at 60% 40%, rgba(255,255,255,.9) 70%, transparent 80%),
radial-gradient(circle at 50% 70%, rgba(255,255,255,.9) 65%, transparent 75%);
border-radius:50%;
filter:blur(2px);
pointer-events:none;
}

@keyframes cloudMove{
from{ transform:translateX(-20vw); }
to{ transform:translateX(120vw); }
}

/* STARS */

.stars{
position:absolute;
inset:0;
background-image:
radial-gradient(2px 2px at 20% 30%, white 60%, transparent),
radial-gradient(2px 2px at 70% 60%, white 60%, transparent),
radial-gradient(1px 1px at 40% 80%, white 60%, transparent);
opacity:0;
animation:twinkle 2s infinite alternate ease-in-out;
}

@keyframes twinkle{
from{opacity:.3}
to{opacity:1}
}
/* ===== RAIN PARTICLE ===== */
.rain{
position:absolute;
inset:0;
overflow:hidden;
opacity:0;
}

.drop{
position:absolute;
width:2px;
height:18px;
background:rgba(255,255,255,.9);
border-radius:2px;
transform:rotate(20deg);
animation:rainFall linear infinite;
}

@keyframes rainFall{
from{transform:translate(-40px,-20px) rotate(20deg)}
to{transform:translate(140px,110vh) rotate(20deg)}
}


/* ===== FOG SMOOTH ===== */
.fog{
position:absolute;
inset:0;
opacity:0;
filter:blur(90px);
background:
radial-gradient(circle at 30% 40%,rgba(255,255,255,.25),transparent 60%),
radial-gradient(circle at 70% 60%,rgba(255,255,255,.2),transparent 60%);
}


/* ===== LIGHTNING FLASH ===== */
.flash{
position:absolute;
inset:0;
background:white;
opacity:0;
pointer-events:none;
}/* ================= CARD ================= */

.card{
position:relative;
z-index:10;

width:420px;
max-width:90%;

padding:28px;
border-radius:22px;

background:rgba(8,15,30,0.75);
backdrop-filter:blur(14px);

border:1px solid rgba(255,255,255,0.15);
box-shadow:0 20px 60px rgba(0,0,0,0.45);
}

.big{font-size:48px;font-weight:700}
.section{margin-top:14px;font-size:13px}

.scoreBar{
height:10px;
border-radius:8px;
background:rgba(255,255,255,.15);
overflow:hidden;
margin-top:6px;
}

.scoreFill{
height:100%;
transition:.4s;
}

.data-row {
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  font-size:14px;
}

#cloudType {
  font-weight:600;
}

</style>
</head>

<body>

<div id="sky">
  <div class="sunMoon" id="sunMoon"></div>
  <div class="stars" id="stars"></div>
  <div class="clouds" id="clouds"></div>
  <div class="fog" id="fog"></div>
<div class="rain" id="rain"></div>
<div class="flash" id="flash"></div>
</div>

<div class="card">
<div id="clock"></div>
<h2 id="city">Mendeteksi lokasi...</h2>
<div class="big" id="temp">--°C</div>
<div id="desc"></div>
<div class="section" id="outdoorScore"></div>
<div class="data-row">
  <span>Peluang Hujan:</span>
  <span id="rainChance">-</span>
</div>
<div class="scoreBar" style="height: 5px; margin-bottom: 10px;">
  <div id="rainFill" class="scoreFill" style="width: 0%; background: #3b82f6"></div>
</div>
<div class="data-row">
  <span>Kondisi Hembusan:</span>
  <span id="gustStatus" style="font-weight: bold;">Tenang</span>
</div>
<div class="scoreBar" style="height: 6px; margin-top: 4px; margin-bottom: 12px;">
  <div id="gustFill" class="scoreFill" style="width: 0%; background: #94a3b8;"></div>
</div>
<div class="data-row">
  <span>Tipe Awan:</span>
  <span id="cloudType">-</span>
</div>
<div id="rainStatus" style="font-size: 13px; margin-top: -5px; margin-bottom: -5px; color: #94a3b8; font-style: italic;">
    Menganalisis kondisi udara...
</div>
<div class="section" id="extra"></div>
<div class="section" id="recommendation"></div>
<div class="section" id="warning"></div>
</div>

<script>

// Variabel cadangan agar tidak undefined
let lastLat = -0.5021; // Koordinat default Samarinda
let lastLon = 117.1536;

getLocation();

function getLocation() {
navigator.geolocation.getCurrentPosition(pos=>{
getWeather(pos.coords.latitude,pos.coords.longitude);
});
};

/* ================= CLOCK ================= */
const clockEl=document.getElementById("clock");
setInterval(()=>{
clockEl.innerText=new Date().toLocaleTimeString();
},1000);

/* ================= BACKGROUND ENGINE (FIXED) ================= */
// --- FUNGSINYA ---
function setDynamicBackground(currentIcon, sunrise, sunset, cloudPercent){
    const body = document.body;
    const sunMoon = document.getElementById("sunMoon");
    const stars = document.getElementById("stars");
    const clouds = document.getElementById("clouds");
    const fog = document.getElementById("fog");
    const rain = document.getElementById("rain");
    const flash = document.getElementById("flash");
    
    // Pastikan interval petir lama dibersihkan
    if(window.lightningInterval) stopLightning();

    body.className = "";
    const now = Date.now() / 1000;

    /* 1. TIME MODE LOGIC */
    let mode = "night";
    if(now < sunrise) mode = "night";
    else if(now < sunrise + 3600) mode = "morning";
    else if(now < sunset - 3600) mode = "day";
    else if(now < sunset) mode = "evening";
    else mode = "night";

    body.classList.add(mode);

    /* 2. SUN/MOON & STARS DISPLAY */
    sunMoon.className = "sunMoon " + (mode === "night" ? "moon" : "sun");
    stars.style.opacity = (mode === "night") ? 1 : 0;

    /* 3. RESET WEATHER EFFECTS */
    clouds.style.opacity = 0.2;
    fog.style.opacity = 0;
    rain.style.opacity = 0;
    sunMoon.style.display = "block";
    rain.innerHTML = "";

    /* 4. CLOUD INTENSITY (Always active) */
    setCloudIntensity(cloudPercent);

    /* 5. WEATHER EFFECTS BASED ON ICON (THE HAKIM SINC) */
    
    // Jika Hujan (Icon 🌧️)
    if(currentIcon === "🌧️"){
        sunMoon.style.display = "none";
        clouds.style.opacity = 0.8;
        fog.style.opacity = 0.25;
        rain.style.opacity = 1;
        createRain(120); // Gerimis/Hujan sedang
    }

    // Jika Badai (Icon ⛈️)
    if(currentIcon === "⛈️"){
        sunMoon.style.display = "none";
        clouds.style.opacity = 0.9;
        fog.style.opacity = 0.35;
        rain.style.opacity = 1;
        createRain(220); // Hujan deras
        startLightning(); // Nyalakan efek petir
    }

    // Jika Kabut (Icon 🌫️)
    if(currentIcon === "🌫️"){
	sunMoon.style.display = "none";
        fog.style.opacity = 1;
        clouds.style.opacity = 0;
	stars.style.display = "none";
    }

    // Jika Mendung Pekat (Icon ☁️)
    if(currentIcon === "☁️"){
        sunMoon.style.display = "none";
        clouds.style.opacity = 1;
    }
}

/* HUJAN PARTICLE */
function createRain(n){
  rain.innerHTML="";
  for(let i=0;i<n;i++){
    const d=document.createElement("div");
    d.className="drop";
    d.style.left=Math.random()*100+"%";
    d.style.animationDuration=(0.3+Math.random()*0.5)+"s";
    d.style.animationDelay=Math.random()+"s";
    rain.appendChild(d);
  }
}

/* --- PETIR ENGINE --- */
function startLightning(){
    // Gunakan window agar interval bisa diakses global untuk stop
    window.lightningInterval = setInterval(() => {
        const flash = document.getElementById("flash");
        if(Math.random() < 0.35 && flash){
            flash.style.opacity = 0.9;
            setTimeout(() => flash.style.opacity = 0, 80);
            setTimeout(() => {
                flash.style.opacity = 0.6;
                setTimeout(() => flash.style.opacity = 0, 60);
            }, 120);
        }
    }, 1500);
}

function stopLightning(){
    clearInterval(window.lightningInterval);
    const flash = document.getElementById("flash");
    if(flash) flash.style.opacity = 0;
}

function setCloudIntensity(percent){

const amount = Math.floor(percent*2); // 0–20 awan
createClouds(amount);

}

function createClouds(n){

const clouds = document.getElementById("clouds");
clouds.innerHTML = "";

for(let i=0;i<n;i++){

  const c = document.createElement("div");
  c.className = "cloud";

  const size = 120 + Math.random()*200;

  c.style.width = size+"px";
  c.style.height = size*0.6+"px";

  c.style.top = Math.random()*80 + "%";
  c.style.left = Math.random()*100 + "%";

  c.style.opacity = 0.3 + Math.random()*0.5;
c.style.zIndex = Math.floor(Math.random()*3);

  c.style.animation = `cloudFloat ${20+Math.random()*30}s ease-in-out infinite`;

  clouds.appendChild(c);
}
}

/* ================= WEATHER ================= */
function getWeather(lat,lon){

const apiKey="b313e26bc324fe7d98b9611f6767b770";

fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=metric&lang=id&appid=${apiKey}`)
.then(response => response.json())
.then(data => {

    // ===============================
    // 2️⃣ FETCH OPEN METEO
    // ===============================
    return fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,pressure_msl,dew_point_2m,cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,wind_speed_10m,cape,precipitation,precipitation_probability,shortwave_radiation,direct_radiation,diffuse_radiation,terrestrial_radiation,surface_temperature,soil_temperature_0_to_7cm,soil_moisture_0_to_1cm&hourly=temperature_2m,relative_humidity_2m,dew_point_2m,pressure_msl,cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,wind_speed_10m,cape,precipitation,precipitation_probability,shortwave_radiation,direct_radiation,diffuse_radiation,terrestrial_radiation,surface_temperature,soil_temperature_0_to_7cm,soil_moisture_0_to_1cm&daily=temperature_2m_mean&past_days=7&forecast_days=1`)
    .then(res => res.json())
    .then(meteo => {

        const meteoData = meteo.current || {};
	const meteoData_record = meteo.hourly || {};

        console.log("OPEN WEATHER:", data);
        console.log("OPEN METEO:", meteoData);
        console.log("OPEN METEO HOURLY RECORD:", meteoData_record);

	// --- LOGIKA HITUNG WEEKLY MEAN ---
        // meteo.daily.temperature_2m_mean akan berisi array 8 data (7 hari lalu + hari ini)
        const dailyArray = meteo.daily.temperature_2m_mean;
        const validData = dailyArray.filter(t => t !== null);
        const weeklyMean = validData.reduce((a, b) => a + b, 0) / validData.length;

        console.log(`Weekly Mean (7 Days): ${weeklyMean.toFixed(2)}°C`);


//Cek Update Data API

const pressures = meteoData_record.pressure_msl || [];

// 1. Waktu Lokal Browser
    const localTime = new Date().toLocaleTimeString('id-ID');

    // 2. Timestamp Server Open-Meteo (Format: YYYY-MM-DDTHH:MM)
const rawTime = meteo.current ? meteo.current.time : null;
let server1Time = "N/A";

if (rawTime) {
    const [datePart, timePart] = rawTime.split('T');
    let [hour, minute] = timePart.split(':');
    
    // Tambahkan 8 jam untuk WITA
    let witaHour = parseInt(hour) + 8;
    
    // Jika lebih dari 24 jam, berarti ganti hari (opsional tapi bagus buat akurasi)
    if (witaHour >= 24) {
        witaHour -= 24;
        // Catatan: Tanggalnya tidak berubah di sini karena ini logic simpel, 
        // tapi jamnya akan benar (misal jam 23 UTC jadi jam 07 WITA)
    }

    const formattedHour = String(witaHour).padStart(2, '0');
    server1Time = `${datePart} ${formattedHour}:${minute} WITA`;
}

// 3. Timestamp Server OpenWeatherMap (Format Unix)
    // OWM biasanya meletakkan waktu di api2.dt (Current API) atau api2.current.dt (One Call API)
    const owmUnix = data.dt || (data.current ? data.current.dt : null);
    let server2Time = "N/A";

    if (owmUnix) {
        const dateOWM = new Date(owmUnix * 1000); // Kalikan 1000 untuk milidetik
        server2Time = dateOWM.getHours().toString().padStart(2, '0') + ":" + 
                      dateOWM.getMinutes().toString().padStart(2, '0') + ":" + 
                      dateOWM.getSeconds().toString().padStart(2, '0');
    }

    // --- MONITORING SERVER DI CONSOLE ---
    console.log("======================================");
    console.log(`📡 SYNC STATUS [${localTime}]`);
    console.log(`⏱️ Open-Meteo Server : ${server1Time}`);
    console.log(`⏱️ OpenWeather Server: ${server2Time} (OWM)`);
    
    // Cek perbandingan kesegaran data
    console.log("--------------------------------------");
if (server2Time !== "N/A") {
        console.log("💡 Tips: Jika jam OWM lebih baru (mendekati jam lokal) dibanding Open-Meteo,");
        console.log("   berarti OWM memberikan data yang lebih fresh saat ini.");
    }
    console.log("======================================");

const pressureTrend = detectPressureTrend(pressures);

console.log("Pressure Trend:", pressureTrend);

/* ===== BASIC ===== */

document.getElementById("city").innerText=data.name;
document.getElementById("temp").innerText=Math.round(data.main.temp)+"°C";

const icon = getWeatherIcon(data.weather[0].main);


// Ambil data dasar
const humidityOWM = data.main.humidity; // Data dari OpenWeatherMap
const humidityOM  = meteoData.relative_humidity_2m; // Data dari Open-Meteo
const isRaining   = (meteoData.precipitation > 0 || data.weather[0].main.toLowerCase().includes("rain"));

let finalHumidity;
let sourceInfo = "";

if (isRaining) {
    // SAAT HUJAN: Ambil angka tertinggi (Veto)
    finalHumidity = Math.max(humidityOWM, humidityOM);
    sourceInfo = " (Rain Mode - High Precision)";
} else {
    // TIDAK HUJAN: Tetap pakai OWM (Default Bapak)
    finalHumidity = humidityOWM;
    sourceInfo = " (Standard Mode)";
}

const uvData = calculateUV(
data.weather[0].main.toLowerCase(),
data.clouds.all,
(data.visibility ?? 10000) / 1000,
data.sys.sunrise,
data.sys.sunset,
data.coord.lat,
// data.main.humidity,
finalHumidity,
data.main.pressure,
meteoData.cloud_cover_low,
meteoData.cloud_cover_mid,
meteoData.cloud_cover_high
);

const chance = calculateNonLinearRain(
// data.main.humidity,
finalHumidity,
    data.main.temp,
    meteoData.cape,    
    pressureTrend, 
    data.clouds.all, 
    data.weather[0].main.toLowerCase(),
    data.sys.sunrise,
    data.sys.sunset,
meteoData.precipitation,
meteoData.precipitation_probability
);

// --- UPDATE UI BAR & TEKS STATUS ---
const rainLabel = document.getElementById("rainChance");
const rainFill = document.getElementById("rainFill");
const rainStatusEl = document.getElementById("rainStatus");

const awan = data.clouds.all;
const humi = // data.main.humidity;
finalHumidity;

rainLabel.innerText = chance + "%";
rainFill.style.width = chance + "%";

const nowUnix = Date.now() / 1000;
const isNightTime = (nowUnix < data.sys.sunrise || nowUnix > data.sys.sunset);

let statusText = "";
let statusColor = "#94a3b8";

/* ==========================
   🌙 NIGHT LOGIC
========================== */

if(isNightTime){

    if(chance >= 99){
        statusText = "🌧️ Hujan sedang terjadi di sebagian/seluruh wilayah.";
        statusColor = "#f87171";
    }

    else if(
        humi > 95 &&
        pressureTrend === "Stable Pressure ☁️"
    ){
        statusText = "❄️ Udara sangat jenuh, potensi embun tebal.";
        statusColor = "#a5f3fc";
    }

    else if(
        pressureTrend === "Convective Pressure Drop ⛈️"
    ){
        statusText = "⚡ Atmosfer labil, potensi hujan konvektif malam.";
        statusColor = "#fbbf24";
    }

    else{
        statusText = "🌙 Atmosfer relatif stabil.";
    }

}

/* ==========================
   ☀️ DAY LOGIC
========================== */

else{

    if(chance >= 99){
        statusText = "🌧️ Hujan sedang terjadi.";
        statusColor = "#f87171";
    }

    else if(
        awan > 85 &&
        chance > 70 &&
        pressureTrend === "Convective Pressure Drop ⛈️"
    ){
        statusText = "🌩️ Mendung pekat, hujan kemungkinan segera turun.";
        statusColor = "#fbbf24";
    }

    else if(chance > 70){
        statusText = "⚠️ Probabilitas hujan tinggi.";
        statusColor = "#f87171";
    }

    else if(chance < 40 && humi > 80){
        statusText = "🍃 Udara lembap namun atmosfer stabil.";
        statusColor = "#22c55e";
    }

    else{
        statusText = "☁️ Kondisi atmosfer cenderung stabil.";
    }
}

/* ==========================
   APPLY TO UI
========================== */

rainStatusEl.innerText = statusText;
rainStatusEl.style.color = statusColor;

//Hembusan Angin
const gustMS = Math.max(data.wind.gust || 0, data.wind.speed);
const gustKmH = Math.round(gustMS * 3.6);

const gustStatusLabel = document.getElementById("gustStatus");
const gustFill = document.getElementById("gustFill");

let statusTextAngin = "Tenang";
let barColor = "#94a3b8"; // Abu-abu
let barWidth = "15%";

if (gustKmH > 40) {
    statusTextAngin = "Sangat Bahaya! ⛔";
    barColor = "#be123c"; // Merah Tua
    barWidth = "100%";
} else if (gustKmH > 25) {
    statusTextAngin = "Waspada Crosswind ⚠️";
    barColor = "#f43f5e"; // Merah Muda/Rose
    barWidth = "75%";
} else if (gustKmH > 15) {
    statusTextAngin = "Terasa Kencang";
    barColor = "#fbbf24"; // Kuning
    barWidth = "45%";
} else if (gustKmH > 5) {
    statusTextAngin = "Sepoi-sepoi";
    barColor = "#22c55e"; // Hijau
    barWidth = "25%";
}

// Terapkan ke UI
gustStatusLabel.innerText = statusTextAngin;
gustStatusLabel.style.color = barColor;
gustFill.style.width = barWidth;
gustFill.style.background = barColor;

/* ===== EXTRA DATA ===== */

const wind=data.wind.speed;
const angin=Math.round(data.wind.speed*3.6);
const humidity = // data.main.humidity;
finalHumidity;
/* ===== DEW POINT ===== */
const a = 17.27;
const b = 237.7;

const alpha = ((a * data.main.temp) / (b + data.main.temp)) + Math.log(humidity/100);
const dewPoint = (b * alpha) / (a - alpha);
let dewStatus = "Nyaman";

if(dewPoint >= 27) dewStatus = "Sangat Gerah 🥵";
else if(dewPoint >= 24) dewStatus = "Gerah";
else if(dewPoint >= 20) dewStatus = "Lembap";
else if(dewPoint >= 16) dewStatus = "Sejuk";
else dewStatus = "Kering ❄️";
const visibility = (data.visibility || 10000) / 1000;
const pressure=data.main.pressure;
const cloud = data.clouds.all;
const sunrise=formatTime(data.sys.sunrise);
const sunset=formatTime(data.sys.sunset);
const gust = data.wind.gust;

const cloudType = detectCloudType({
  openWeather: data,
  uv: uvData.value,
  openMeteo: meteoData
});

/* ======================================= 
   🚨 THE HAKIM LOGIC (ANTI-NGAWUR) V2.0
   ======================================= */

// 1. Definisikan Variabel Pendukung dari meteoData
const lastIndex = meteoData_record.pressure_msl.length - 1;
const pressNow  = meteoData_record.pressure_msl[lastIndex];
const press3h   = meteoData_record.pressure_msl[lastIndex - 3] || pressNow;
const delta3h   = pressNow - press3h; // Trend 3 jam (Penting untuk deteksi pemerasan awan)
const jenis_awan = cloudType

const uvNow       = uvData.value;
const directRad   = meteoData.direct_radiation;
const capeNow     = meteoData.cape;
const curahHujan  = meteoData.precipitation;

const rawHum   = data.main.humidity;
const rawCloud = data.clouds.all;    // Dari OWM
const rawPress = pressNow - (meteoData_record.pressure_msl[lastIndex - 1]); // 1h Change

let weatherDesc = data.weather[0].description;
let weatherIcon = icon; // Asumsi variabel icon sudah didefinisikan sebelumnya
const currentHour = new Date().getHours();
// --- START LOGIC OVERRIDE ---

// A. LOGIKA "COMPRESSION DRIZZLE" (Kasus Spesifik Bapak Tadi)
// Jika tekanan naik tapi langit jenuh, ini bukan cerah, tapi awan diperas.
if (curahHujan > 0 && curahHujan <= 1 ) {
    weatherDesc = "Gerimis ☁️💧";

function detectPressureTrend(pressures){
const now = new Date();
const currentHour = now.getHours();

  if(!pressures || pressures.length < 7){
    return "Data Tidak Cukup";
  }

  const currentIndex = pressures.length - 1; 

  const sekarang = pressures[currentIndex];
  const threeHoursAgo = pressures[currentIndex - 3];
  const sixHoursAgo = pressures[currentIndex - 6];

  const drop3h = sekarang - threeHoursAgo;
  const drop6h = sekarang - sixHoursAgo;
  const drop1h = sekarang - pressures[currentIndex - 1];

  console.log("Pressure 1h change:", drop1h);
  console.log("Pressure 3h change:", drop3h);
  console.log("Pressure 6h change:", drop6h);

  /* =============================
     TROPICAL CLASSIFICATION
  ============================== */

/* ==============================================
      TROPICAL CLASSIFICATION (1h & 3h Combined)
     ============================================== */

  // 1. Rapid system drop (6h tetap prioritas tertinggi untuk sistem besar)
  if(drop6h <= -6){
    return "Rapid Cyclonic Drop 🌪️";
  }

  // 2. Strong convective signal (Diperkuat dengan deteksi cepat 1 jam)
  // Menangkap badai lokal lebih cepat jika drop 1h tajam ATAU total 3h sudah tembus -3
  if(drop1h <= -1.1 || drop3h <= -3){
    return "Convective Pressure Drop ⛈️";
  }

  // 3. Normal diurnal oscillation (Drop)
  // Ditambahkan validasi drop1h < 0 agar lebih sinkron dengan tren turun
  if(drop3h <= -1.5 && drop3h > -3){
    return "Diurnal Pressure Drop 🌅";
  }

  // 4. Normal diurnal oscillation (Rise)
  if(drop3h < 3 && drop3h >= 1.5){
    return "Diurnal Pressure Rise 🌅";
  }

  // 5. Rising pressure (clearing sky)
  // Jika kenaikan 3 jam signifikan, langit biasanya terbuka
  if(drop3h >= 3){
    return "Rising Pressure 🌤️";
  }

  // 6. Default
  return "Stable Pressure ☁️";
}

/* ======================================================= */
/* === KOREKSI TEKANAN LOKAL (PRESSURE EFFECT ENGINE) === */
/* ======================================================= */
function calculate_pressure_effect(pressure) {
    const STANDARD_P = 1013.25;
    // Jika grnd_level tidak ada, default ke standar agar efek 0
    let densityRatio = pressure ? (pressure / STANDARD_P) : 1;
    
    // Memberikan koreksi halus. Jika 1009 hPa, koreksi sekitar -0.01 s/d -0.05
    // Berguna untuk universalitas (Puncak vs Pantai)
    return (densityRatio - 1) * 2.5;
}

function getWindEffect(temp, humidity, wind, gust, weatherMain, pressure){
    const skinTemp = 34;
    let v = Math.max(wind || 0, gust);

    if(v < 0.5) return 0;

    // Tambahan: Faktor Kepadatan Udara (Universal)
    // Angin di dataran rendah (padat) lebih "terasa" dibanding dataran tinggi (tipis)
    const densityFactor = pressure ? (pressure / 1013.25) : 1;

    const a = 17.27;
    const b = 237.7;
    const alpha = ((a * temp) / (b + temp)) + Math.log(humidity/100);
    const dew = (b * alpha) / (a - alpha);

    let vaporGradient = Math.max(0, skinTemp - dew);
    let evapEfficiency = Math.min(1.2, vaporGradient / 20);

    // Ventilasi angin kini dipengaruhi kepadatan udara lokal
    let windVent = Math.sqrt(v) * 0.9 * densityFactor;

    let effect = 0;
    if(temp < skinTemp){
        if (weatherMain.includes("rain") || weatherMain.includes("sleet") || weatherMain.includes("drizzle")) {
            windVent *= 1.4; 
        }
        effect = windVent * evapEfficiency;
    } else {
        let heatDelta = (temp - skinTemp) / 10;
        effect = - windVent * heatDelta * (1 - evapEfficiency);
    }
    return effect;
}

}

// 3. Eksekusi ke Variabel Feel
feel += weather_cond;

console.log(`Main Weather Realfeel: ${weather_cond.toFixed(2)}°C (${weatherMain})`);

}

/* ========================= */

function getLayeredCloudReduction(low, mid, high){

  // Normalisasi 0–1
    const l = low / 100;
    const m = mid / 100;
    const h = high / 100;

    // Transmission per layer (nonlinear exponential decay)
    // Angka 2.0, 1.5, 0.6 adalah kekuatan optikal relatif

    const T_low  = Math.exp(-1.2 * Math.pow(l, 1.4));
    const T_mid  = Math.exp(-0.7 * Math.pow(m, 1.3));
    const T_high = Math.exp(-0.12 * Math.pow(h, 1.2));

const combined =
    0.39 * T_mid +
    0.18 * T_high +
    0.44 * T_low;

const reduction = 1 - combined;

    return Math.min(reduction, 0.97);
}

function getCloudReduction(cloudPercent, weatherMain, visibility, humidity, pressure, lowCloud, midCloud, highCloud){

let reduction = 0;

/* ======================================= */
    /* 1. CLOUD FACTOR (Dibuat Lebih Ringan)   */
    /* ======================================= */
reduction = getLayeredCloudReduction(
    lowCloud,
    midCloud,
    highCloud
);

/* ============================= */
/* ===== WEATHER OVERRIDE ====== */
/* ============================= */

weatherMain = weatherMain.toLowerCase();

if(weatherMain.includes("rain")){
  reduction += 0.12;
}

if(weatherMain.includes("thunderstorm")){
  reduction = 0.95;
}

if(weatherMain.includes("mist") || weatherMain.includes("fog")){
  // Jika visibility masih terbaca tinggi (> 5km), kita paksa turun ke 5km
  // untuk memicu hitungan nonlinear di bawah secara maksimal
  visibility = Math.min(visibility, 5); 
  reduction += 0.05; // Bonus kecil untuk efek hamburan partikel air padat
}

/* ============================= */
/* ===== ATMOSPHERIC FACTOR ==== */
/* ============================= */

// Jarak pandang rendah (Aerosol/Haze)
    if (visibility < 10) {
        // Semakin rendah visibility, kenaikan reduction semakin tajam (eksponensial)
        reduction += Math.pow((10 - visibility) / 10, 2) * 0.15;
    }

    // Humidity (Efek Difusi Uap Air)
    if (humidity > 85) {
        const humidFactor = (humidity - 85) / 15; // Rentang 0.0 s/d 1.0
        // Jika humidity 100%, reduction bertambah 0.15 (lebih kuat dari sebelumnya)
        reduction += Math.pow(humidFactor, 2) * 0.15; 
    }

/* clamp biar gak over */
reduction = Math.min(reduction, 0.97);

return reduction;
}

function calculateUV(weatherMain, cloud, visibility, sunrise, sunset, lat, humidity, pressure, lowcloud, midcloud, highcloud){

const nowDate = new Date();
const now = nowDate.getTime()/1000;

if(now < sunrise || now > sunset){
  return { value: 0, category: "Night Mode 🌙" };
}


/* ========================= */
/* ===== DAY OF YEAR ======= */
/* ========================= */

const start = new Date(nowDate.getFullYear(),0,0);
const diff = nowDate - start;
const day = Math.floor(diff/86400000);


/* ========================= */
/* ===== DECLINATION ======= */
/* ========================= */

const decl =
23.44 * Math.sin((2*Math.PI/365)*(day-81));


/* ========================= */
/* ===== HOUR ANGLE ======== */
/* ========================= */

const hour = nowDate.getHours() + nowDate.getMinutes()/60;
const hourAngle = (hour - 12) * 15; // deg


/* ========================= */
/* ===== SOLAR ELEVATION === */
/* ========================= */

const latRad = lat*Math.PI/180;
const decRad = decl*Math.PI/180;
const hRad = hourAngle*Math.PI/180;

const sinElev =
Math.sin(latRad)*Math.sin(decRad) +
Math.cos(latRad)*Math.cos(decRad)*Math.cos(hRad);

const sunFactor = Math.pow(Math.max(0, sinElev), 1.15);

/* ========================= */
/* ===== BASE UV (physics) == */
/* ========================= */

let maxUV = 11 + (2 * Math.cos(latRad));
const airMass = 1 / Math.pow(Math.max(0, sinElev), 1.15);
let uv = maxUV * sunFactor / Math.pow(airMass, 0.1);


/* ========================= */
/* ===== CLOUD MOD ========= */
/* ========================= */

/* ========================= */
/* ===== NONLINEAR REDUCTION */
/* ========================= */

let reduction = getCloudReduction(
  cloud,
  weatherMain,
  visibility,
  humidity ?? 80,
  pressure, 
  lowcloud,
  midcloud,
  highcloud
);

/* ========================= */
/* ===== EST. THICKNESS ==== */
/* ========================= */

// normalisasi layer
const low = lowcloud ?? cloud;
const mid = midcloud ?? cloud;
const high = highcloud ?? cloud;

// bobot layer (low paling tebal)
let thicknessIndex =
  (low * 0.6) +
  (mid * 0.35) +
  (high * 0.05);

// humidity boost (awan basah lebih tebal)
thicknessIndex *= 1 + ((humidity ?? 80) - 70) / 200;

// visibility penalty (jarak pandang rendah → lebih tebal)
if (visibility) {
  const visFactor = Math.max(0.5, Math.min(1.2, 10000 / visibility));
  thicknessIndex *= visFactor;
}

// clamp biar nggak liar
thicknessIndex = Math.max(0, Math.min(50, thicknessIndex / 2));

const k = 0.035;
const thicknessTransmission = Math.exp(-k * thicknessIndex);

const combinedTransmission =
  (1 - reduction) * thicknessTransmission;

uv *= combinedTransmission*1.25;

/* ========================= */
/* ===== SUN BREAK SMOOTH == */
/* ========================= */

// solar elevation derajat
const solarElevationDeg =
  Math.asin(Math.max(-1, Math.min(1, sinElev))) * 180/Math.PI;

// deteksi sun break
const isSunBreak =
  cloud >= 30 && cloud <= 95 &&
  solarElevationDeg > 25 &&
  weatherMain.includes("cloud");

if (isSunBreak) {

  // waktu dalam menit untuk phase natural
  const timePhase = now / 60; 

  // oscillation halus (periode ±6 menit)
  const smoothWave =
    Math.sin(timePhase * 0.017); 

  // amplitudo 6–12% tergantung kepadatan awan
  const densityFactor = (cloud - 30) / 65; 
  const amplitude = 0.06 + (densityFactor * 0.06);

  uv *= (1 + smoothWave * amplitude);

  // cloud edge enhancement ringan (jarang & halus)
  if (solarElevationDeg > 55 && Math.sin(timePhase * 0.003) > 0.98) {
    uv *= 1.08;
  }

  // cap fisik
  const theoreticalMax = maxUV * sunFactor;
  uv = Math.min(uv, theoreticalMax * 1.2);
}


/* ========================= */
/* ===== FINAL ======= */
/* ========================= */

uv = Math.max(0, Math.min(12, Math.round(uv)));


/* ========================= */
/* ===== CATEGORY ========= */
/* ========================= */

let category="";
if(uv<=2) category="Low";
else if(uv<=5) category="Moderate";
else if(uv<=7) category="High";
else if(uv<=10) category="Very High";
else category="Extreme ☀️";

return { value: uv, category };
}

function detectCloudType({ openWeather, uv, openMeteo }){

  /* =========================
     BASIC DATA
  ========================= */

  const now = Date.now()/1000;
  const sunrise = openWeather.sys.sunrise;
  const sunset = openWeather.sys.sunset;
  const isDay = now > sunrise && now < sunset;

  const weatherMain = openWeather.weather[0].main.toLowerCase();
  const pressure = openWeather.main.pressure;
  const humidity = openWeather.main.humidity;
  const angin = Math.max(openWeather.wind.speed || 0, openWeather.wind.gust || 0);

  /* =========================
     OPEN METEO DATA
  ========================= */

  const cape = openMeteo?.cape ?? 0;
  const low = openMeteo?.cloud_cover_low ?? 0;
  const mid = openMeteo?.cloud_cover_mid ?? 0;
  const high = openMeteo?.cloud_cover_high ?? 0;
  const shortwave = openMeteo?.shortwave_radiation ?? 0;

  const totalCloud = Math.max(low, mid, high);

  /* =========================================================
     1️⃣ CUMULONIMBUS DETECTION (VERTICAL DEVELOPMENT)
  ========================================================= */

// ===============================
// 1️⃣ Cb Aktif (fase matang)
// ===============================
if(
  weatherMain.includes("thunderstorm") ||
  (cape > 1200 && low > 40 && mid > 40)
){
  return "Cumulonimbus Aktif ⛈️";
}

// ===============================
// 2️⃣ Cb Berkembang (fase naik)
// ===============================
if(
  cape > 800 &&
  low > 40 &&
  mid > 70
){
  return "Cumulonimbus Berkembang 🌩️";
}

// ===============================
// 3️⃣ Cb Pasif (hujan konvektif ringan)
// ===============================
if(
  weatherMain.includes("rain") &&
  cape > 500 &&
  cape <= 1000
){
  return "Cumulonimbus Pasif 🌩️";
}

// ===============================
// 4️⃣ Cb Lewat (anvil sisa)
// ===============================
if(
  cape > 800 &&
  high > 70 &&
  mid > 50 &&
  low < 30 &&
  angin >= 8
){
  return "Cumulonimbus Lewat 🌪️";
}


  /* =========================================================
     2️⃣ NIMBOSTRATUS (Hujan luas stabil)
  ========================================================= */

  if(cape < 700 && mid > 80 && high > 90){
    return "Nimbostratus ☁️🌧️";
  }

  /* =========================================================
     3️⃣ LOW CLOUD DOMINANT
  ========================================================= */

  if(low > 70 && mid < 40){
    if(isDay){
      return "Stratus Overcast ☁️";
    } else {
      return "Overcast Night ☁️🌙";
    }
  }

  if(low > 50){
    return "Stratocumulus 🌥️";
  }

  if(low > 30 && cape < 200){
    return "Cumulus Humilis 🌤️";
  }

  /* =========================================================
     4️⃣ MID CLOUD DOMINANT
  ========================================================= */

  if(mid >= 80 && high >= 90){
    return "Altostratus / Altocumulus ☁️";
  }

  /* =========================================================
     5️⃣ HIGH CLOUD DOMINANT
  ========================================================= */

  if(high > 80 && mid < 20 && low < 20){
    if(isDay){
      return "Cirrus / Cirrostratus ☁️";
    } else {
      return "High Cloud Night 🌙☁️";
    }
  }

  if(high > 40){
    return "Thin Cloud Layer 🌤️";
  }

  /* =========================================================
     6️⃣ CLEAR CONDITIONS
  ========================================================= */

  if(totalCloud < 20){
    if(isDay){
      if(shortwave > 700 && uv > 6){
        return "Clear Sky Strong Solar ☀️";
      }
      return "Mostly Clear ☀️";
    } else {
      return "Clear Night 🌙";
    }
  }

  /* =========================================================
     DEFAULT FALLBACK
  ========================================================= */

  return isDay ? "Mostly Clear ☀️" : "Clear Night 🌙";
}

function calculateOutdoorScore(feelLike, currentIcon, uv, gust, visibility){
    let score = 10;

    /* ================= */
    /* ===== UV ======== */
    /* ================= */
    // Penyesuaian: UV rendah di tengah hari (Shielding) tidak mengurangi skor banyak
    if(uv >= 11) score -= 8;
    else if(uv >= 8) score -= 6;
    else if(uv >= 6) score -= 4;
    else if(uv >= 3) score -= 2;

    /* ================= */
    /* ===== WEATHER ==== */
    /* ================= */
    // Sinkronisasi menggunakan Icon hasil Hakim Logic
    if(currentIcon === "⛈️") score -= 9;
    else if(currentIcon === "🌧️") score -= 5;
    else if(currentIcon === "☁️") score -= 1; // Mendung pekat potong tipis
    else if(currentIcon === "🌫️") score -= 2; // Kabut

    // Bonus Skor untuk Kondisi "Syahdu" (UV rendah & Suhu Nyaman)
    // Jika tidak ada icon hujan
    if(uv >= 1 && uv <= 3 && 
       feelLike >= 22 && feelLike <= 30 && 
       currentIcon !== "🌧️" && currentIcon !== "⛈️") {
       score += 1;
    }

    /* ================= */
    /* ===== WIND ======= */
    /* ================= */
    if(gust > 9) score -= 2;
    else if(gust > 4) score -= 1;

    /* ================= */
    /* ===== VISIBILITY = */
    /* ================= */
    if(visibility < 3) score -= 3;
    else if(visibility < 6) score -= 1;

    /* ================= */
    /* ===== TEMP ======= */
    /* ================= */
    if(feelLike > 37) score -= 3;
    else if(feelLike > 33) score -= 2;
    else if(feelLike > 29) score -= 1;
    else if(feelLike < 11) score -= 1;

    /* Clamp & Return */
    score = Math.max(1, Math.min(10, score));

    console.log(`Outdoor Score Debug: Score=${score}, Icon=${currentIcon}, UV=${uv}`);
    return score;
}

//Perhitungan Peluang Hujan
function calculateNonLinearRain(
    hum,
    temp,
    cape,
    pressureTrend,    // String: "Rising Pressure 🌤️", dll
    cloud,
    weather,
    sunrise,
    sunset,
    precipitation,    // mm hujan aktual
    pop               // Probabilitas dasar dari API (%)
){
let score = 0;
    const now = Date.now() / 1000;
    const isNight = (now < sunrise || now > sunset);
    const cond = weather.toLowerCase();

    /* ======================================= */
    /* 1️⃣ INTERNAL DEW POINT CALCULATION       */
    /* ======================================= */
    const a = 17.27;
    const b = 237.7;
    const alpha = ((a * temp) / (b + temp)) + Math.log(Math.max(1, hum) / 100);
    const dewPoint = (b * alpha) / (a - alpha);
    
    // Spread: Jarak suhu ke titik embun
    const spread = Math.abs(temp - dewPoint);

    /* ======================================= */
    /* 2️⃣ HARD OVERRIDE (DETEKSI REAL-TIME)    */
    /* ======================================= */
    if (precipitation > 0 || cond.includes("rain") || cond.includes("thunderstorm") || cond.includes("drizzle")) {
        return 100;
    }

    /* ======================================= */
    /* 3️⃣ BASE PROBABILITY (ANCHOR)            */
    /* ======================================= */
    let popBase = (pop || 0) * 0.5;
    score += popBase;

    /* ======================================= */
    /* 4️⃣ SPREAD & CLOUD COUPLING (ANTI-FOG)   */
    /* ======================================= */
    if (spread < 2) {
        // Jenuh di bawah + Awan tebal di atas = Hujan
        if (cloud > 75) {
            score += 25; 
        } else {
            // Jenuh di bawah + Langit bersih = Kabut/Embun (Bukan Hujan)
            score -= 15; 
        }
    } else if (spread < 5) {
        score += 10;
    }

    /* ======================================= */
    /* 5️⃣ INSTABILITY (CAPE - BAHAN BAKAR)     */
    /* ======================================= */
    if (cape > 800) {
        score += (Math.sqrt(cape) / 10); 
    }

    /* ======================================= */
    /* 6️⃣ HUMIDITY & CLOUD FACTOR (NON-LINEAR) */
    /* ======================================= */
    let humFactor = Math.pow(hum / 100, 3) * 35;
    let cloudFactor = Math.pow(cloud / 100, 2) * 20;
    score += (humFactor + cloudFactor);

    /* ======================================= */
    /* 7️⃣ PRESSURE TREND LOGIC                 */
    /* ======================================= */
    switch(pressureTrend){
        case "Rapid Cyclonic Drop 🌪️": score += 35; break;
        case "Convective Pressure Drop ⛈️": score += 25; break;
        case "Rising Pressure 🌤️": score -= 35; break; // "Rem" otomatis saat cuaca membaik
    }

    /* ======================================= */
    /* 8️⃣ NIGHT & SENSITIVITY FILTER           */
    /* ======================================= */
    if (isNight) {
        let cloudClearness = 1 - (cloud / 100);
        score -= (Math.pow(cloudClearness, 1.5) * 20);
    }

    // Filter Virga (Hujan menguap sebelum sampai tanah)
    if (hum < 50) score -= 15;

    /* ======================================= */
    /* 9️⃣ FINAL NORMALIZATION                  */
    /* ======================================= */
    if (pop >= 80) score = Math.max(score, pop - 10);

    let final = Math.min(Math.round(score), 99);
    final = Math.max(final, 3);

    console.log(`--- RAIN LOGIC ---`);
    console.log(`Temp: ${temp}°C, DewPoint: ${dewPoint.toFixed(1)}°C, Spread: ${spread.toFixed(1)}°C`);
    console.log(`Trend: ${pressureTrend}, Final: ${final}%`);

    return final;
}

function autoUpdateScheduler() {
    const now = new Date();
    const minutes = now.getMinutes();
    const seconds = now.getSeconds();

    // 1. Cari kapan menit kelipatan 10 selanjutnya
    // Jika sekarang menit 12, maka targetnya menit 20
    const nextTenMinutes = Math.ceil((minutes + 0.1) / 10) * 10;
    
    let diffMinutes = nextTenMinutes - minutes;
    
    // Jika sekarang jam 2:55, target berikutnya jam 3:00 (menit 60)
    // ini akan otomatis terhitung diffMinutes = 5
    
    const msToNextUpdate = (diffMinutes * 60 * 1000) - (seconds * 1000);

    console.log(`Update otomatis terjadwal pada menit ke-${nextTenMinutes % 60 === 0 ? '00' : nextTenMinutes}`);
    console.log(`Tunggu ${(msToNextUpdate / 1000).toFixed(0)} detik lagi...`);

    // 2. Set Timer
    setTimeout(() => {
        console.log("Waktu tercapai! Merefresh data...");
        
        // Panggil fungsi ambil data kamu
        getLocation();
        
        // 3. REKURSIF: Panggil lagi fungsi scheduler ini
        // Supaya dia menjadwalkan update berikutnya (10 menit lagi)
        autoUpdateScheduler();

    }, msToNextUpdate);
}

// Jalankan pertama kali saat aplikasi dibuka
autoUpdateScheduler();

</script>
